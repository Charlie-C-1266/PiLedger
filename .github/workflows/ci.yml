name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Run ruff check
        run: uv run ruff check --output-format=github .

      - name: Run ruff format check
        run: uv run ruff format --check .

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run mypy
        run: uv run mypy

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run pytest with coverage
        run: uv run pytest --cov=src --cov-report=term-missing

      - name: Write coverage summary
        if: always()
        run: |
          echo '## Coverage report' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          uv run coverage report >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend (build + lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

      - name: Tests (vitest + coverage)
        run: npm run test:coverage
        working-directory: frontend

      - name: Write frontend coverage summary
        if: always()
        run: |
          echo '## Frontend coverage' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          npm run test:coverage --silent 2>&1 | tail -30 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
        working-directory: frontend

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v6

      - name: Install Python dependencies
        run: uv sync --frozen

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      # The e2e suite boots Uvicorn and drives the real React SPA, which the
      # backend serves from src/static/dist — so the frontend must be built
      # before the browser tests can load anything.
      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Install Playwright Chromium
        run: uv run playwright install --with-deps chromium

      - name: Run e2e suite
        run: uv run pytest tests/e2e --tracing=retain-on-failure

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore

  lockfile-check:
    name: Lockfile drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Verify requirements.txt matches lockfile
        run: |
          uv export --no-hashes --no-dev 2>/dev/null > /tmp/expected-requirements.txt
          diff -u requirements.txt /tmp/expected-requirements.txt

  audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run pip-audit
        run: uv run pip-audit --strict

  image-scan:
    name: Image scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build the same multi-stage runtime image that docker-compose ships, so
      # the scan covers exactly what gets deployed (OS packages + installed
      # Python wheels), not just the source tree.
      - name: Build the runtime image
        run: docker build -t piledger:${{ github.sha }} .

      # Fail the build on HIGH/CRITICAL vulnerabilities that have a fix
      # available. ignore-unfixed keeps the gate actionable — an unpatched
      # upstream CVE with no fix yet can't be resolved by us, so it shouldn't
      # block every PR until a patched version exists.
      - name: Scan image for HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: piledger:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

  dast:
    name: DAST baseline (ZAP)
    runs-on: ubuntu-latest
    # Report-only for now: the scan is unauthenticated, so it only reaches the
    # login page, static assets and /healthz. It's a passive smoke test that
    # uploads a report artifact — it does not open issues or fail the build.
    # Authenticated active scanning is a follow-up.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v6

      - name: Install Python dependencies
        run: uv sync --frozen

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      # ZAP crawls the real running app, which serves the SPA from
      # src/static/dist — build it first so the target isn't a half-mounted app.
      - name: Build frontend
        run: npm run build
        working-directory: frontend

      # Boot Uvicorn on the runner host and wait for /healthz before handing the
      # URL to ZAP. The ZAP action runs its scanner container with
      # --network=host, so 127.0.0.1:8080 inside it reaches this process.
      - name: Start PiLedger
        run: |
          uv run uvicorn --app-dir src app:app --host 127.0.0.1 --port 8080 &
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1; then
              echo "PiLedger is up"
              exit 0
            fi
            sleep 1
          done
          echo "PiLedger did not become healthy in time" >&2
          exit 1
        env:
          PILEDGER_DB: /tmp/piledger-dast.db

      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://127.0.0.1:8080
          # Don't fail the build on passive-rule warnings, and don't auto-file a
          # GitHub issue — the uploaded zap_scan report artifact is the output.
          fail_action: false
          allow_issue_writing: false
